<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function(){
      try {
        var saved = localStorage.getItem('simmer-theme');
        document.documentElement.setAttribute('data-theme', saved || 'light');
      } catch(e) {}
    })();
  </script>
  <style>
    html { background: #FBFAF6; color: #171A17; }
    html[data-theme="dark"] { background: #14170F; color: #F2F5EF; }
    body { background: inherit; color: inherit; }
  </style>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Savor | Recipes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Work+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FBFAF6;
      --bg-elevated: #EFF1EA;
      --surface: #F7F3EE;
      --surface-strong: #F0E6DD;
      --ink: #171A17;
      --ink-muted: #5B665C;
      --line: rgba(23, 26, 23, 0.13);
      --header-bg: rgba(251, 250, 246, 0.96);
      --header-ink: #171A17;
      --header-muted: #3F4A40;
      --coral: #E85A3B;
      --herb: #2F6B47;
      --ocean: #2A6E8C;
      --gold: #B87D00;
      --btn-text: #FBFAF6;
      --display: 'Bricolage Grotesque', sans-serif;
      --body: 'Work Sans', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html[data-theme="dark"] {
      --bg: #14170F;
      --bg-elevated: #1F231C;
      --surface: #1A211B;
      --surface-strong: #232C27;
      --ink: #F2F5EF;
      --ink-muted: #9AA79C;
      --line: rgba(242, 245, 239, 0.13);
      --header-bg: rgba(20, 23, 15, 0.86);
      --header-ink: #F2F5EF;
      --header-muted: #C7D0C8;
      --coral: #FF7A57;
      --herb: #5FA97A;
      --ocean: #59B0D3;
      --gold: #E8AC2E;
      --btn-text: #14170F;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      animation: pageIn 0.5s var(--ease);
      transition: background 0.3s ease, color 0.3s ease;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    a { color: inherit; }
    img { display: block; max-width: 100%; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--header-bg);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      gap: 24px;
      transition: padding 0.25s var(--ease);
    }

    header.scrolled .header-row { padding: 12px 32px; }

    .header-left {
      display: flex;
      align-items: center;
      gap: 44px;
    }

    .wordmark {
      text-decoration: none;
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.01em;
      color: var(--header-ink);
      transition: font-size 0.25s var(--ease);
    }

    header.scrolled .wordmark { font-size: 1.28rem; }

    .wordmark span {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: var(--coral);
      letter-spacing: 0.12em;
      font-weight: 400;
    }

    nav {
      display: flex;
      gap: 32px;
    }

    nav a {
      text-decoration: none;
      position: relative;
      padding-bottom: 3px;
      font-size: 0.85rem;
      color: var(--header-muted);
      letter-spacing: 0.01em;
      transition: color 0.2s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1.5px;
      background: var(--coral);
      transition: width 0.25s var(--ease);
    }

    nav a:hover { color: var(--header-ink); }
    nav a:hover::after { width: 100%; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, color-mix(in srgb, var(--coral) 14%, transparent), color-mix(in srgb, var(--gold) 10%, transparent));
      color: var(--header-ink);
      text-decoration: none;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: transform 0.2s var(--ease), border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .header-cta:hover,
    .header-cta:focus-visible {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--coral) 45%, var(--line));
      box-shadow: 0 12px 20px -16px rgba(232, 90, 59, 0.45);
    }

    .header-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--bg-elevated) 76%, transparent);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      border: 1px solid color-mix(in srgb, var(--line) 80%, transparent);
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--header-muted);
    }

    .meta-pill strong {
      color: var(--header-ink);
      font-size: 0.7rem;
      letter-spacing: 0.03em;
    }

    .meta-pill.accent {
      background: linear-gradient(135deg, color-mix(in srgb, var(--coral) 16%, transparent), color-mix(in srgb, var(--gold) 12%, transparent));
      color: var(--header-ink);
    }

    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--bg-elevated);
      color: var(--header-ink);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s var(--ease), border-color 0.2s ease;
    }

    .theme-toggle:hover { transform: translateY(-1px) rotate(-8deg); }
    .theme-toggle:active { transform: translateY(1px) rotate(-8deg); }
    .theme-toggle svg { width: 17px; height: 17px; }
    .theme-toggle .icon-moon { display: none; }
    html[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
    html[data-theme="dark"] .theme-toggle .icon-moon { display: block; }

    .page-shell {
      padding: 70px 0 100px;
    }

    .page-head {
      margin-bottom: 30px;
      padding: 26px 26px 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 96%, transparent), color-mix(in srgb, var(--bg) 90%, transparent));
      box-shadow: 0 18px 40px -28px rgba(0,0,0,0.28);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      color: var(--herb);
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .page-head h1 {
      font-family: var(--display);
      font-size: clamp(2.3rem, 4vw, 3.6rem);
      line-height: 0.96;
      letter-spacing: -0.04em;
      margin-bottom: 10px;
    }

    .page-head p {
      color: var(--ink-muted);
      max-width: 55ch;
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin: 24px 0 18px;
      align-items: center;
      justify-content: space-between;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 300px;
      max-width: 420px;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      stroke: var(--ink-muted);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-elevated);
      color: var(--ink);
      padding: 0 16px 0 42px;
      font: inherit;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-wrap input:focus {
      outline: none;
      border-color: color-mix(in srgb, var(--coral) 65%, transparent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--coral) 12%, transparent);
    }

    .category-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
    }

    .category-btn {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-muted);
      border-radius: 999px;
      padding: 9px 12px;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.22s var(--ease), background 0.22s ease, border-color 0.22s ease, color 0.22s ease, box-shadow 0.22s ease;
      will-change: transform;
    }

    .category-btn:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--coral) 52%, var(--line));
    }

    .category-btn:active {
      animation: buttonPress 0.24s var(--ease);
      transform: scale(0.98);
    }

    .category-btn.active,
    .category-btn:hover.active {
      color: var(--btn-text);
      background: var(--coral);
      border-color: var(--coral);
      box-shadow: 0 12px 22px -16px rgba(232, 90, 59, 0.8);
    }

    @keyframes buttonPress {
      0% { transform: scale(1); }
      40% { transform: scale(0.97); }
      100% { transform: scale(1); }
    }

    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 24px 0 18px;
      color: var(--ink-muted);
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .results-bar strong { color: var(--ink); }

    .recipe-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    @media (max-width: 900px) {
      .recipe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 780px) {
      .header-row { flex-wrap: wrap; gap: 14px; padding: 16px 22px; }
      .header-left { flex: 1 1 100%; flex-wrap: wrap; gap: 18px; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; width: 100%; justify-content: flex-start; }
      nav a { font-size: 0.78rem; }
      .header-right { width: 100%; justify-content: space-between; }
      .wordmark { font-size: 1.35rem; }
    }

    @media (max-width: 620px) {
      .recipe-grid { grid-template-columns: 1fr; }
      .header-row { padding: 14px 18px; }
      .header-right { justify-content: flex-start; gap: 12px; }
      nav { gap: 10px; }
      .toolbar { align-items: stretch; }
      .search-wrap { max-width: none; }
      .results-bar { flex-direction: column; align-items: flex-start; }
      .category-filter { justify-content: flex-start; gap: 10px; }
      .card { padding: 20px 16px; min-height: auto; }
      .card-visual { height: 180px; }
      .result-count { margin: 18px 0 16px; }
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 320px;
      padding: 20px 18px 18px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg) 94%, transparent), color-mix(in srgb, var(--surface) 92%, transparent));
      box-shadow: 0 18px 38px -32px rgba(0,0,0,0.28);
      transition: transform 0.25s var(--ease), border-color 0.2s ease, box-shadow 0.25s var(--ease), opacity 0.25s ease;
      cursor: pointer;
      text-decoration: none;
      overflow: hidden;
      isolation: isolate;
      opacity: 0;
      transform: translateY(12px) scale(0.98);
      animation: cardIn 0.32s var(--ease) forwards;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--coral), transparent 52%);
      transform: scaleX(0.24);
      transform-origin: left;
      transition: transform 0.28s var(--ease);
      opacity: 0.9;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-6px);
      border-color: color-mix(in srgb, var(--coral) 40%, var(--line));
      box-shadow: 0 26px 50px -30px rgba(0, 0, 0, 0.3);
    }

    .card:hover::before,
    .card:focus-visible::before {
      transform: scaleX(1);
    }

    .card-visual {
      height: 160px;
      border-radius: 14px;
      background-size: cover;
      background-position: center;
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .card-visual::after {
      content: attr(data-label);
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 6px 9px;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 999px;
      color: white;
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card h2 {
      font-family: var(--display);
      font-size: 1.3rem;
      line-height: 1.12;
      letter-spacing: -0.03em;
      max-width: 16ch;
    }

    .card p {
      color: var(--ink-muted);
      font-size: 0.93rem;
      line-height: 1.6;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      background: rgba(255,255,255,0.12);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 54px 20px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      text-align: center;
      color: var(--ink-muted);
      background: color-mix(in srgb, var(--surface) 65%, transparent);
    }

    @media (max-width: 620px) {
      .toolbar { align-items: stretch; }
      .search-wrap { max-width: none; }
      .results-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header id="siteHeader">
    <div class="header-row">
      <div class="header-left">
        <a href="index.html" class="wordmark">Savor <span>EST. 2026</span></a>
        <nav aria-label="Main navigation">
          <a href="index.html">Featured</a>
          <a href="recipes.html">Recipes</a>
          <a href="index.html#about">About</a>
          <a href="index.html#contactus">Contact Us</a>
        </nav>
      </div>
      <div class="header-right">
        <a href="recipes.html" class="header-cta">Recipes</a>
        <div class="header-meta" aria-label="Savor community stats">
          <span class="meta-pill"><strong>12k</strong> cooks</span>
          <span class="meta-pill accent">This week</span>
        </div>
        <button class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap page-shell">
    <section class="page-head">
      <span class="eyebrow">Recipe archive</span>
      <h1>Everything worth cooking.</h1>
      <p>From fast pantry wins to slow Sunday suppers, this is the full list of recipes ready for your next weeknight decision.</p>
    </section>

    <div class="toolbar">
      <label class="search-wrap" aria-label="Search recipes">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="M16 16L21 21"></path>
        </svg>
        <input id="searchInput" type="search" placeholder="Search recipes, ingredients, cuisines…" />
      </label>
    </div>

    <div class="category-filter" id="categoryFilter" aria-label="Recipe categories"></div>

    <div class="results-bar">
      <span><strong id="resultCount">0</strong> recipes</span>
      <span id="resultLabel">Showing all</span>
    </div>

    <section class="recipe-grid" id="allRecipeGrid" aria-live="polite"></section>
  </main>

  <script>
    window.__SAVOR_SUPABASE_CONFIG__ = window.__SAVOR_SUPABASE_CONFIG__ || { url: '', anonKey: '' };
    window.__SAVOR_SUPABASE_CONFIG_READY__ = (async function() {
      try {
        const response = await fetch('/api/supabase-config');
        const config = await response.json();
        if (config.url) {
          window.__SAVOR_SUPABASE_CONFIG__.url = config.url;
          window.SUPABASE_URL = config.url;
        }
        if (config.anonKey) {
          window.__SAVOR_SUPABASE_CONFIG__.anonKey = config.anonKey;
          window.SUPABASE_ANON_KEY = config.anonKey;
        }
      } catch (error) {
        console.warn('Supabase runtime config could not be loaded from Vercel.', error);
      }
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
  <script src="recipe-data.js"></script>
  <script src="supabase-client.js"></script>
  <script>
    const grid = document.getElementById('allRecipeGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const resultCount = document.getElementById('resultCount');
    const resultLabel = document.getElementById('resultLabel');
    const state = { search: '', category: 'all' };
    const categories = ['all', 'Breakfast', 'Lunch', 'Dinner', 'Snack', 'Dessert'];
    let recipes = [];

    function renderCategoryButtons() {
      categoryFilter.innerHTML = categories.map((category) => {
        const isActive = state.category === category;
        return '<button class="category-btn ' + (isActive ? 'active' : '') + '" data-category="' + category + '" type="button">' + category + '</button>';
      }).join('');

      categoryFilter.querySelectorAll('.category-btn').forEach((button) => {
        button.addEventListener('click', function() {
          state.category = this.dataset.category;
          renderCategoryButtons();
          renderRecipes();
        });
      });
    }

    function matchesRecipe(recipe) {
      const normalizedRecipe = normalizeRecipe(recipe);
      const query = state.search.trim().toLowerCase();
      const haystack = [
        normalizedRecipe.title,
        normalizedRecipe.tag,
        normalizedRecipe.summary,
        normalizedRecipe.category,
        normalizedRecipe.meal,
        normalizedRecipe.diet,
        normalizedRecipe.cuisine,
        (normalizedRecipe.ingredients || []).join(' ')
      ].join(' ').toLowerCase();

      const matchesSearch = !query || haystack.includes(query);
      const matchesCategory = state.category === 'all' || normalizedRecipe.category === state.category;
      return matchesSearch && matchesCategory;
    }

    function renderRecipes() {
      const normalizedRecipes = (recipes || []).map(normalizeRecipe);
      const filtered = normalizedRecipes.filter(matchesRecipe);

      if (!filtered.length) {
        grid.innerHTML = '<div class="empty-state">No recipes match that search or category yet. Try another keyword or reset the filter.</div>';
      } else {
        grid.innerHTML = filtered.map((recipe) => `
          <a href="recipe-info.html?id=${recipe.id}" data-id="${recipe.id}" class="card" aria-label="Open ${recipe.title}">
            <div class="card-visual" data-label="${(recipe.meta || []).slice(-1)[0] || ''}" style="background: linear-gradient(180deg, rgba(0,0,0,0.1), rgba(0,0,0,0.26)), url('${recipe.image}') center/cover no-repeat;"></div>
            <div>
              <div class="eyebrow" style="margin-bottom:10px; color: var(--coral);">${recipe.tag}</div>
              <h2>${recipe.title}</h2>
            </div>
            <p>${recipe.summary}</p>
            <div class="card-meta">
              ${[normalizeRecipe(recipe).category, recipe.diet, recipe.cuisine, (recipe.meta || [])[0]].map((item) => '<span class="chip">' + item + '</span>').join('')}
            </div>
          </a>
        `).join('');
      }

      requestAnimationFrame(() => {
        const cards = grid.querySelectorAll('.card');
        cards.forEach((card, index) => {
          card.style.animationDelay = (index * 40) + 'ms';
          card.classList.add('card-visible');
        });
      });

      // Save clicked recipe into sessionStorage so recipe page can render immediately
      requestAnimationFrame(() => {
        const anchors = grid.querySelectorAll('.card');
        anchors.forEach(function(a) {
          a.addEventListener('click', function() {
            try {
              const id = a.dataset.id;
              const match = recipes.find(function(r) { return String(r.id) === String(id); });
              if (match) sessionStorage.setItem('savor_selected_recipe', JSON.stringify(match));
            } catch (e) {}
          });
        });
      });

      resultCount.textContent = String(filtered.length);
      resultLabel.textContent = state.category === 'all' && !state.search ? 'Showing all' : 'Filtered view';
    }

    async function loadRecipes() {
      try {
        const remoteRecipes = await getAllRecipes();
        return Array.isArray(remoteRecipes) ? remoteRecipes.map(normalizeRecipe) : [];
      } catch (error) {
        console.warn('Failed to load recipes from Supabase.', error);
        return [];
      }
    }

    async function init() {
      renderCategoryButtons();
      grid.innerHTML = '<div class="empty-state">Loading recipes…</div>';
      resultCount.textContent = '0';
      resultLabel.textContent = 'Loading';

      try {
        const remoteRecipes = await loadRecipes();
        recipes = (remoteRecipes || []).map(normalizeRecipe);
      } catch (error) {
        console.warn('Failed to load recipes from Supabase, using local fallback.', error);
        recipes = (window.SAVOR_RECIPES || []).map(normalizeRecipe);
      }

      renderRecipes();
    }

    searchInput.addEventListener('input', function(event) {
      state.search = event.target.value;
      renderRecipes();
    });

    init();

    const themeBtn = document.getElementById('themeToggle');
    const header = document.getElementById('siteHeader');
    function currentTheme() {
      return document.documentElement.getAttribute('data-theme') || 'light';
    }
    function setTheme(next) {
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('simmer-theme', next); } catch (error) {}
      themeBtn.setAttribute('aria-pressed', String(next === 'dark'));
      themeBtn.setAttribute('aria-label', next === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
    }
    try {
      const saved = localStorage.getItem('simmer-theme');
      if (saved === 'dark' || saved === 'light') setTheme(saved);
    } catch (error) {}
    if (!localStorage.getItem('simmer-theme')) setTheme('light');
    themeBtn.addEventListener('click', function() {
      setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
    });

    window.addEventListener('scroll', function() {
      header.classList.toggle('scrolled', window.scrollY > 40);
    }, { passive: true });
  </script>
</body>
</html>
